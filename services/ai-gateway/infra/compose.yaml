name: inference-commerce
services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: inference
      POSTGRES_DB: inference
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in private runtime.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:18542:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U inference -d inference]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  gateway:
    image: inference-commerce:${RELEASE_ID:-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        RELEASE_ID: ${RELEASE_ID:-local}
    restart: unless-stopped
    init: true
    env_file:
      - ${RUNTIME_DIR:?Set private RUNTIME_DIR}/runtime.env
    environment:
      HOST: 0.0.0.0
      PORT: '8080'
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: '8081'
      WEB_DIST_DIR: /app/apps/web/dist
      PUBLIC_BASE_URL: https://inference.pochinit.online
      COOKIE_SECURE: 'true'
      TRUSTED_PROXY_CIDRS: 10.203.85.1/32,127.0.0.1/32,::1/128
      TRUST_PROXY: 'true'
      LEGACY_KEYS_FILE: /run/secrets/legacy-keys.json
      NODE_ENV: production
      RELEASE_ID: ${RELEASE_ID:-local}
    volumes:
      - ${RUNTIME_DIR}/legacy-keys.json:/run/secrets/legacy-keys.json:ro
    ports:
      - 127.0.0.1:18540:8080
      - 127.0.0.1:18541:8081
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres-data:
networks:
  default:
    ipam:
      config:
        - subnet: 10.203.85.0/28

    mode.value='short';reset();await open();change('source-path','/read-slowly');click('source-check');await until(()=>key('source-public-ack')&&!key('source-public-ack').disabled,'checked result');
    await delay(1900);assert(dialog.element.querySelector('.sw-app-settings-source-result .sw-app-settings-source-target').textContent.includes('/read-slowly'),'expiry removed reviewed target');
    assert(calls.filter(value=>value.op==='apps.source.promote').length===0,'timer invoked promotion');passed.push('После истечения проверки карточка остаётся; таймер не переключает');
    mode.value='lost';reset();await open();change('source-path','/lost-reply');click('source-check');await until(()=>key('source-public-ack')&&!key('source-public-ack').disabled,'public consent');
    change('source-public-ack',true);click('source-promote');await until(()=>localStorage.getItem(pendingKey)&&key('pending-retry')?.getAttribute('aria-disabled')==='false','unknown reply');
    const first=calls.find(value=>value.op==='apps.source.promote');assert(first,'promote was not dispatched');await open();click('pending-retry');
    await until(()=>JSON.parse(localStorage.getItem(pendingKey)).pending===null,'receipt settled');const sends=calls.filter(value=>value.op==='apps.source.promote');
    assert(sends.length===2&&JSON.stringify(sends[0].args)===JSON.stringify(sends[1].args),'remount changed pending');passed.push('Потерянный ответ: remount повторяет точный запрос');
    await open();key('source-history').open=true;await until(()=>calls.some(value=>value.op==='apps.source.history'),'history requested');await delay(40);
    const autoRows=dialog.element.querySelectorAll('.sw-app-settings-history-row').length;
    const beforeHistory=calls.filter(value=>value.op==='apps.source.history').length;click('source-history-first');
    await until(()=>calls.filter(value=>value.op==='apps.source.history').length>beforeHistory,'manual latest requested');await delay(40);
    const manualRows=dialog.element.querySelectorAll('.sw-app-settings-history-row').length;
    assert(autoRows===backend.targets.length&&manualRows===backend.targets.length,`history rows auto=${autoRows}, manual=${manualRows}; expected ${backend.targets.length}`);
    assert(dialog.element.querySelector('.sw-app-settings-history-list').textContent.includes('/original')&&dialog.element.querySelector('.sw-app-settings-history-list').textContent.includes('/lost-reply'),'history omitted immutable paths');
    passed.push('История A+B: автооткрытие и «К последним» показывают обе конфигурации');
    mode.value='normal';change('source-path','/history-visible-C');click('source-check');await until(()=>key('source-public-ack')&&!key('source-public-ack').disabled,'checked next source with history open');
    change('source-public-ack',true);click('source-promote');
    await until(()=>JSON.parse(localStorage.getItem(pendingKey)).pending===null&&dialog.element.querySelectorAll('.sw-app-settings-history-row').length===3,'history refreshed after own promotion');
    assert(dialog.element.querySelector('.sw-app-settings-history-list').textContent.includes('/history-visible-C'),'successful promotion left history without the new configuration');
    assert(![...dialog.element.querySelectorAll('.sw-app-settings-source-block')].some(node=>!node.hidden&&/История и текущие настройки различаются/u.test(node.textContent)),'successful promotion left a stale history alert');
    assert(![...dialog.element.querySelectorAll('.sw-app-settings-notice')].some(node=>!node.hidden&&/Читаем текущий источник/u.test(node.textContent)),'successful inspection remained in loading status');
    passed.push('Открытая история обновляется после своего переключения без вечного статуса чтения');
    mode.value='normal';reset();await open();change('source-path','/confirmed-before-inspection');click('source-check');await until(()=>key('source-public-ack')&&!key('source-public-ack').disabled,'checked source before inspection failure');
    change('source-public-ack',true);failedInspections=1;click('source-promote');
    await until(()=>localStorage.getItem(pendingKey)&&JSON.parse(localStorage.getItem(pendingKey)).pending===null&&dialog.element.textContent.includes('Текущий источник не удалось проверить'),'accepted source and failed inspection');
    assert(calls.filter(value=>value.op==='apps.source.promote').length===1,'inspection failure retried a committed promotion');
    click('refresh');await until(()=>dialog.element.querySelector('.sw-app-settings-source').textContent.includes('/confirmed-before-inspection')&&key('refresh').getAttribute('aria-busy')==='false','inspection recovered');
    assert(![...dialog.element.querySelectorAll('.sw-app-settings-notice')].some(node=>!node.hidden&&/не удалось проверить|Читаем текущий источник/u.test(node.textContent)),'recovered inspection retained a failure or loading status');
    assert(JSON.parse(localStorage.getItem(pendingKey)).pending===null&&calls.filter(value=>value.op==='apps.source.promote').length===1,'refresh resurrected a completed mutation');
    passed.push('Принятое переключение остаётся подтверждённым после отказа чтения и явного обновления');
    for(const action of ['pending-retry','source-pending-retry']){
      mode.value='lost';reset();await open();change('source-path',`/displayed-${action}`);click('source-check');await until(()=>key('source-public-ack')&&!key('source-public-ack').disabled,'checked displayed source');
      change('source-public-ack',true);click('source-promote');await until(()=>localStorage.getItem(pendingKey)&&key('pending-retry')?.getAttribute('aria-disabled')==='false','displayed unknown source');
      const other=createAppSettingsState({accountId,appId,storage:localStorage,locks:navigator.locks}),displayed=other.read().pending;
      assert(displayed.op==='apps.source.promote','wrong displayed operation');await other.abandon(displayed);
      const replacement=await other.prepare({op:'apps.domains.claim',args:{appId,expectedAccountId:accountId,expectedDomainsRevision:1,slug:'other-unseen-command'}});
      // Same-window storage write deliberately emits no storage event. The
      // actual displayed DOM still describes A while the shared slot holds B.
      const before=calls.length;click(action);await delay(70);
      assert(calls.length===before,`${action} dispatched an unseen replacement`);
      assert(JSON.stringify(other.read().pending)===JSON.stringify(replacement),`${action} cleared replacement`);
      passed.push(`${action}: устаревшая кнопка не отправляет запрос другой вкладки`);
    }
    mode.value='slow';reset();await open();change('source-path','/late-account');click('source-check');await until(()=>deferredReply,'held prepare');
    const release=deferredReply;close();release();await delay(40);assert(!document.querySelector('dialog')&&calls.filter(value=>value.op==='apps.source.promote').length===0,'late callback returned after dispose');passed.push('Поздний ответ после закрытия не возвращает чужой экран');
    result.dataset.testStatus='pass';result.textContent=`PASS ${passed.length}/${passed.length}\n${passed.join('\n')}\nРеальных сетевых действий: 0. Ручная клавиатура/геометрия проверяются отдельно.`;
  }catch(error){result.dataset.testStatus='fail';result.textContent=`FAIL после ${passed.length} сценариев: ${error.message}\n${passed.join('\n')}`;}finally{automatic=false;}
}
document.querySelector('#qa-open').onclick=()=>{void open();};document.querySelector('#qa-reset').onclick=()=>{reset();result.textContent='Сброшены только синтетические данные этого стенда.';};
document.querySelector('#qa-tests').onclick=()=>{void run();};document.querySelector('#qa-theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();};
if(new URLSearchParams(location.search).get('run')==='1')void run();
</script>
</html>

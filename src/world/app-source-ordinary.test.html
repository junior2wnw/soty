<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Обычное приложение · настоящий локальный стенд</title>
<style>body{margin:0;font:14px/1.5 system-ui}.qa{padding:10px;background:#f5f6f2}.qa button{min-height:44px;padding:8px;margin:3px}#host.sw-app{position:relative;inset:auto;z-index:auto;height:calc(100dvh - 180px);min-height:400px;display:flex}#host>.sa-stage{flex:1}</style>
<section class="qa"><p>Только вымышленные данные. Настоящие подписанный Connect, Human вход, установленный коннектор и два независимых Source SQL. Новый пустой ресурс создаёт Native профиль только после явного согласия и проверенного OIDC.</p>
<button id="board">Открыть новое приложение A</button><button id="library">Открыть новое приложение B</button><button id="restart">Перезапустить приложения</button><button id="revoke">Отозвать доступ в приложениях</button><button id="close">Закрыть приложение</button>
<p id="result" role="status" data-status="idle">Откройте приложение.</p></section><main id="host" class="sw-app"></main>
<script type="module">
import './world.css';
import {accountClient,observeAccount} from '../core/connect-client.ts';
import {mountAppStage} from './app-stage.ts';
import {formatAppLaunchRoute,parseAppLaunchRoute} from './app-launch.mjs';
if(!import.meta.env.DEV||location.hostname!=='127.0.0.1')throw new Error('fixture_dev_only');
const host=document.querySelector('#host'),output=document.querySelector('#result');let stage,info,accountId,generation=0;
const show=(value,status='ready')=>{output.dataset.status=status;output.textContent=value;};
const code=error=>/^[A-Za-z0-9_:-]{1,100}$/.test(error?.code||'')?error.code:'fixture_check_failed';
observeAccount(state=>{if(stage&&state.accountId!==accountId){generation++;stage.dispose();stage=null;show('Профиль изменён. Приложение закрыто.');}});
async function helper(name,input){const response=await fetch('/__fixture/'+name,{method:input===undefined?'GET':'POST',headers:input===undefined?{}:{'content-type':'application/json'},body:input===undefined?undefined:JSON.stringify(input)});const value=await response.json();if(!response.ok)throw Object.assign(new Error(value.code),{code:value.code});return value;}
async function start(realmId){generation++;stage?.dispose();info=await helper('info');let local=await accountClient.getLocalState();if(!local.accountId)await accountClient.bootstrap('Synthetic browser participant');
  accountId=(await accountClient.getLocalState()).accountId;await helper('grant',{accountId});
  const appId=info.apps.find(value=>value.realmId===realmId).id,app=(await accountClient.extension('apps.list',{}, {expectedAccountId:accountId})).apps.find(value=>value.id===appId);
  const intent=parseAppLaunchRoute(formatAppLaunchRoute({appId})),token=++generation;history.replaceState(null,'','#'+intent.route);
  stage=mountAppStage(host,{api:{request:(method,args)=>accountClient.extension(method,args??{}, {expectedAccountId:accountId})},accountId,
    app:{appId,name:app.name,status:app.state,ownerAccountId:app.ownerAccountId},intent,isCurrent:()=>generation===token,
    async request(args){const reply=await accountClient.extension('apps.launch',args,{expectedAccountId:accountId});return{url:reply.launchUrl,entry:reply.entry,runtimeProfile:reply.runtimeProfile,scopedCloseHandle:reply.scopedCloseHandle,scopedSource:reply.scopedSource,scopedCleanup:accountClient.appSlotCleanup(reply)};},
    onNavigate(next){history.replaceState(null,'','#'+next.route);},onBack(){stage?.dispose();},onAccount(){generation++;stage?.dispose();stage=null;},onSettings(){}});
  await stage.ready;show('Открыто. Подтвердите подключение выбранного проекта внутри приложения.');}
for(const [id,action]of Object.entries({board:()=>start('board'),library:()=>start('library'),restart:async()=>{await helper('restart',{});show('Данные сохранены, приложения перезапущены.');},revoke:async()=>{await helper('revoke',{});show('Native доступ отозван.');},close:()=>{generation++;stage?.dispose();stage=null;show('Приложение закрыто.');}}))document.querySelector('#'+id).addEventListener('click',()=>{const button=document.querySelector('#'+id);button.disabled=true;output.dataset.status='pending';void action().catch(error=>show(code(error),'fail')).finally(()=>{button.disabled=false;});});
</script></html>

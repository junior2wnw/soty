<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legacy app task recovery fixture</title>
<h1>Восстановление старой задачи</h1>
<p>Изолированная проверка с вымышленным аккаунтом. Реальные API не используются.</p>
<button id="run">Проверить</button><pre id="proof" data-test-status="ready">Готово</pre>
<script type="module">
import '../world/world.css';
import { createAppActions } from './local-apps.ts';
const proof = document.querySelector('#proof'), run = document.querySelector('#run');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const check = (value, message) => { if (!value) throw Error(message); };
async function until(predicate) { for (let n=0; n<400; n++) { if (predicate()) return; await wait(10); } throw Error('fixture timeout'); }
const target={hostDeviceId:'fixture-device',connectorId:'fixture-connector',jobId:'fixture-job'};
const proposal={schema:'soty.local-app.v1',name:'Тестовое приложение',port:5111,entryPath:'/board',sourceJobId:target.jobId};
const appId='app-11111111111111111111111111111111';
let accountId, actions, existing, registerCalls=0, opened=[], openFailure=false, listFailure=false;
const accounts=[];
const client={async getLocalState(){return {accountId};},async extension(op,args,context){
  check(context.expectedAccountId===accountId,'account mismatch');
  if(op==='apps.devices')return {devices:[{...target,name:'Компьютер',online:true}]};
  if(op==='apps.agent.read')return {job:{schema:'soty.connector-job.v4',kind:'agent',id:target.jobId,deviceId:target.hostDeviceId,connectorId:target.connectorId,status:'succeeded',result:{text:'Готово',appProposal:proposal}},done:true,events:[],cursor:0};
  if(op==='apps.list'){if(listFailure)throw Error('synthetic offline');return {apps:existing?[existing]:[]};}
  if(op==='apps.register'){registerCalls++;throw Error('client must not register legacy results');}
  throw Error('Unexpected operation '+op);
}};
const action=label=>[...document.querySelectorAll('dialog[open] button')].find(button=>button.textContent.trim()===label);
async function show(){
  actions?.destroy();
  actions=createAppActions(client,async()=>{},undefined,{readAgentCapabilities:async()=>({agentConfigured:true}),openRegisteredApp:async(id,expected)=>{
    check(expected===accountId,'opened after account changed'); if(openFailure)throw Error('synthetic navigation failure'); opened.push(id);
  }});
  await actions.agentCreate(undefined,target);await until(()=>action('Проверить подключение'));
}
run.onclick=async()=>{
  run.disabled=true;proof.dataset.testStatus='running';
  accountId='qa_legacy_'+crypto.randomUUID();accounts.push(accountId);
  const marker='soty.app-registration.v1:'+accountId+':'+target.jobId, oldMarker='historical opaque receipt';
  localStorage.setItem(marker,oldMarker);
  localStorage.setItem('soty.world.agent:'+accountId,JSON.stringify(target));
  try{
    existing=null;await show();action('Проверить подключение').click();
    await until(()=>document.querySelector('dialog[open]')?.textContent.includes('Подходящее приложение не найдено'));
    const body=document.querySelector('dialog[open]').textContent;
    check(body.includes('Подключить приложение')&&body.includes('5111')&&body.includes('/board')&&body.includes('Компьютер'),'manual recovery details missing');
    check(registerCalls===0&&localStorage.getItem(marker)===oldMarker,'legacy check wrote or erased rollback marker');
    existing={id:appId,name:proposal.name,ownerAccountId:accountId,hostDeviceId:target.hostDeviceId,connectorId:target.connectorId,port:proposal.port,entryPath:proposal.entryPath,state:'ready',grants:{accountIds:[],communityIds:[]}};
    listFailure=true;action('Проверить подключение').click();await until(()=>document.querySelector('dialog[open] .sx-agent-error'));
    listFailure=false;action('Проверить подключение').click();await until(()=>action('Открыть приложение'));
    openFailure=true;action('Открыть приложение').click();await until(()=>document.querySelector('dialog[open] .sx-agent-error'));
    openFailure=false;action('Открыть приложение').click();await until(()=>opened.length===1);
    check(opened[0]===appId&&registerCalls===0,'recovery created or opened the wrong application');
    check(localStorage.getItem(marker)===oldMarker,'opening removed the old-version marker');
    check(!localStorage.getItem('soty.world.agent:'+accountId),'opened legacy task would reopen forever');
    proof.dataset.testStatus='passed';proof.textContent='PASS: legacy result / manual connection details / lost prior ACK / list failure / open retry / historical marker preserved / zero browser registrations.';
  }catch(error){proof.dataset.testStatus='failed';proof.textContent=String(error.stack||error);}
  finally{actions?.destroy();for(const account of accounts){localStorage.removeItem('soty.app-create.v1:'+account);localStorage.removeItem('soty.world.agent:'+account);localStorage.removeItem('soty.app-registration.v1:'+account+':'+target.jobId);}run.disabled=false;}
};
</script></html>

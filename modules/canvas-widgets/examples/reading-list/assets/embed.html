<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="soty-parent-origin" content="__SOTY_PARENT_ORIGIN__">
<title>Список чтения</title><link rel="stylesheet" href="/assets/ui.css">
<main class="glass-ui glass-ui__widget reading-widget" data-glass-material="working" data-glass-tone="light" data-glass-role="card" data-glass-safe-area="off" data-glass-render-mode="static">
 <section class="glass-ui__widget-content">
  <div class="glass-ui__widget-identity"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4zm16 0h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-3h3z"/></svg><span>Прочитать позже</span></div>
  <div class="glass-ui__widget-glance reading-glance" aria-label="Состояние списка"><output id="count" aria-label="Записей в списке">—</output><span id="latest">Подключаем ваш список…</span></div>
  <p id="state" class="reading-status" role="status"></p><button id="retry" class="glass-ui__widget-editor" type="button" data-glass-role="control" hidden>Повторить</button>
  <section id="content" class="glass-ui__widget-editor" hidden>
   <form id="add"><label for="title">Что прочитать</label><input id="title" data-glass-role="field" data-glass-safe-area="off" maxlength="240" required autocomplete="off" placeholder="Книга, статья или идея" aria-describedby="draft-state"></form>
   <p id="draft-state" class="reading-status" role="status"></p>
   <ul id="items" aria-label="Мой список чтения"></ul><p id="empty" hidden>Сохраните первую запись.</p>
   <button id="more" type="button" data-glass-role="control" hidden>Ещё записи</button><p id="page-state" class="reading-status" role="status"></p>
  </section>
 </section>
 <footer class="glass-ui__widget-actions"><span id="save-state" class="reading-status" role="status"></span><button id="submit" form="add" type="submit" data-glass-role="accent" disabled>В список</button></footer>
</main><script type="module" src="/assets/ui.js"></script></html>

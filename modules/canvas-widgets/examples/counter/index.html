<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="soty-parent-origin" content="PARENT_ORIGIN">
<title>Счётчик</title>
<link rel="stylesheet" href="/assets/ui.css">
<main class="glass-ui glass-ui__widget counter" data-glass-tone="light" data-glass-material="working" data-glass-role="card" data-glass-safe-area="off" data-glass-render-mode="static" aria-labelledby="title" aria-busy="true">
  <section class="glass-ui__widget-content counter-content">
    <h1 id="title" class="glass-ui__widget-identity">Счётчик</h1>
    <p id="status" role="status" aria-live="polite" data-state="loading">Подключаемся…</p>
    <div class="glass-ui__widget-glance"><output aria-label="Значение">…</output></div>
  </section>
  <footer class="glass-ui__widget-actions">
    <button id="increment" type="button" data-glass-role="accent" aria-label="Прибавить" disabled><span aria-hidden="true">+</span></button>
  </footer>
</main>
<script type="module" src="/assets/ui.js"></script>
</html>
